<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Song Game</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/custom.css">
</head>
<body class="text-center" style="color: white;">
    <img class="mx-auto" src="/songgame.png" alt="Song Game">
    <div class="container d-flex flex-column align-items-center p-2">
        <div class="row container d-flex flex-column align-items-center text-center p-4 m-1">
            <button type="button" id="login" class="btn btn-primary btn-lg align-items-center mt-2 mb-2" data-bs-toggle="modal" data-bs-target="#newGameModal">
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                <span role="status">Host new game</span>
            </button>
            <div id="yourgame" class="d-none">
                <div class="highlightBox mt-2 pt-2 pb-2">
                    <div class="d-flex flex-column" style="color: white;overflow-y: scroll;max-height: 50vh;">
                        <div class="songBox">
                            <div class="gamelabel fw-bold" style="flex-grow: 1;">Your Game</div>
                            <div><button type="button" id="rejoinButton" class="btn btn-primary">Rejoin</button></div>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div class="fw-bold">
                    Or join an existing game
                </div>
                <div class="highlightBox mt-2 pt-2 pb-2">
                    <div id="nogames">
                        <span class="spinner-border spinner-border-lg" aria-hidden="true"></span>
                        <br>
                        No games found so far
                    </div>
                    <div id="joingames" class="d-flex flex-column" style="color: white;overflow-y: scroll;max-height: 50vh;">
                        <div class="songBox d-none" id="exampleGame">
                            <div class="gamelabel fw-bold" style="flex-grow: 1;"></div>
                            <div><button type="button" class="btn btn-primary">Join</button></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newGameModal" tabindex="-1" aria-labelledby="newGameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="newGameModalLabel">New Game</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body align-items-center text-center">
                    <div class="mb-3">
                        <div>
                            Number of songs per person
                        </div>
                        <div id="songCount" class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="songcount" id="songcount1" value="1">
                            <label class="form-check-label" for="songcount1">1</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="songcount" id="songcount2" value="2">
                            <label class="form-check-label" for="songcount2">2</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="songcount" id="songcount3" value="3" checked>
                            <label class="form-check-label" for="songcount3">3</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="songcount" id="songcount4" value="4">
                            <label class="form-check-label" for="songcount4">4</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="songcount" id="songcount5" value="5">
                            <label class="form-check-label" for="songcount5">5</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="songcount" id="songcount6" value="6">
                            <label class="form-check-label" for="songcount6">6</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div>
                            <a class="btn btn-primary" data-bs-toggle="collapse" href="#collapseEra" role="button" aria-expanded="false" aria-controls="collapseEra">
                                Filter by era of music
                            </a>
                        </div>
                        <div class="collapse" id="collapseEra">
                            <label for="afterRange" class="form-label">After</label>
                            <input type="range" class="form-range" min="1950" value="1950" id="afterRange">
                            <div id="afterYear">1950</div>
                            <label for="beforeRange" class="form-label">Before</label>
                            <input type="range" class="form-range" min="1950" id="beforeRange">
                            <div id="beforeYear"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div>
                            <a class="btn btn-primary" data-bs-toggle="collapse" href="#collapseGenre" role="button" aria-expanded="false" aria-controls="collapseGenre">
                                Filter by Genre
                            </a>
                        </div>
                        <div class="collapse" id="collapseGenre">
                            <div class="search-container">
                                <div class="input-group">
                                    <input type="text" id="searchInput" class="form-control bg-danger" placeholder="Search..." aria-label="Search" autocomplete="off">
                                </div>
                                <div class="dropdown">
                                    <ul class="dropdown-menu bg-danger" id="dropdownMenu"></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Back</button>
                    <button type="button" id="createGameButton" class="btn btn-primary" data-bs-dismiss="modal">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/lobby.js"></script>
</body>
</html>
